name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint
        run: swift format lint --strict -r Sources Tests Package.swift
      - name: Test
        run: swift test
      - name: Build for iOS
        run: |
          xcodebuild build -scheme Hitch \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation
