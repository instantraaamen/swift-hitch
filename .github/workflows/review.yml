name: Review

# An automated review comment on pull requests from branches in this repository.
# Pull requests from forks are skipped: secrets are not available to them.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Write in English. Do not edit code and do not build.

            Look for, in this order:
            1. Bugs and behaviour changes the description does not mention.
            2. Anything that adds work to the main thread or takes a lock on a hot path while
               recording is off, and public API that breaks source compatibility.
            3. Missing tests for changed behaviour, and a missing CHANGELOG entry.
            4. Changes to the recording file format that older recordings cannot survive.

            Leave inline comments on specific lines for concrete problems, then one summary
            comment with `gh pr comment`. If you find nothing, say so in one sentence.
            Do not comment on style that the existing code already follows.
