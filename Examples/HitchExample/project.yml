# The Xcode project is generated from this file with XcodeGen:
#   xcodegen generate
name: HitchExample
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
packages:
  swift-hitch:
    path: ../..
targets:
  HitchExample:
    type: application
    platform: iOS
    sources: [HitchExample]
    dependencies:
      - package: swift-hitch
        product: Hitch
    info:
      path: HitchExample/Info.plist
      properties:
        CFBundleDisplayName: Hitch Example
        # Without this an app on an iPhone is not given refresh rates above 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HitchExample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
